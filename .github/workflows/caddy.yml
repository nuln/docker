name: caddy

on:
  push:
    branches: [master]
    paths:
      - "caddy/**"
      - ".github/workflows/caddy.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The version is owned by the Dockerfile's ARG default. This job only reads it
  # back so the image can be tagged; it deliberately does NOT pass it as a
  # build-arg, because an override is exactly what used to make builds drift.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version pinned in the Dockerfiles
        id: ver
        run: |
          set -euo pipefail
          for f in caddy/Dockerfile caddy/Dockerfile.full; do
            V=$(sed -n 's/^ARG CADDY_VERSION=\(.*\)$/\1/p' "$f" | head -1)
            [ -n "$V" ] || { echo "::error::no 'ARG CADDY_VERSION=<version>' in $f"; exit 1; }
            echo "$f pins $V"
          done
          VERSION=$(sed -n 's/^ARG CADDY_VERSION=\(.*\)$/\1/p' caddy/Dockerfile | head -1)
          OTHER=$(sed -n 's/^ARG CADDY_VERSION=\(.*\)$/\1/p' caddy/Dockerfile.full | head -1)
          if [ "$VERSION" != "$OTHER" ]; then
            echo "::error::Dockerfile pins $VERSION but Dockerfile.full pins $OTHER"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Report whether upstream has moved on
        # Informational only, deliberately non-fatal: it records that a bump is
        # available without letting upstream trigger a rebuild on its own.
        run: |
          set -uo pipefail
          PINNED="${{ steps.ver.outputs.version }}"
          LATEST=$(curl -fsSL --max-time 20 https://api.github.com/repos/caddyserver/caddy/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//') || LATEST=""
          if [ -n "$LATEST" ] && [ "$LATEST" != "$PINNED" ]; then
            echo "::notice::Caddy ${LATEST} is released; this repo pins ${PINNED}."
            echo "::notice::To upgrade, edit ARG CADDY_VERSION in caddy/Dockerfile and Dockerfile.full."
          else
            echo "Pinned version is current (${PINNED})."
          fi

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - dockerfile: Dockerfile
            tag_suffix: ""
            extra_tags: "ghcr.io/nuln/caddy:latest"
            verify: true
          - dockerfile: Dockerfile.full
            tag_suffix: "-full"
            extra_tags: "ghcr.io/nuln/caddy:full"
            verify: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: caddy
          file: caddy/${{ matrix.variant.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          # No CADDY_VERSION build-arg on purpose: the Dockerfile's own ARG
          # default is the pinned version, and passing it again is what let this
          # workflow silently build a different Caddy than the source declared.
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/nuln/caddy:${{ needs.version.outputs.version }}${{ matrix.variant.tag_suffix }}
            ${{ matrix.variant.extra_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image caddy version matches tag
        if: matrix.variant.verify
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          docker pull --platform linux/amd64 "ghcr.io/nuln/caddy:${VERSION}"
          IMG_VER=$(docker run --rm --platform linux/amd64 "ghcr.io/nuln/caddy:${VERSION}" caddy version 2>/dev/null | head -1 | awk '{print $1}' | sed 's/^v//')
          echo "In-image caddy version: ${IMG_VER}"
          echo "Expected tag version:   ${VERSION}"
          IMG_VER_N=$(echo "$IMG_VER" | tr -d '[:space:]' | sed 's/^v//')
          VER_N=$(echo "$VERSION" | tr -d '[:space:]' | sed 's/^v//')
          if [ "$IMG_VER_N" != "$VER_N" ]; then
            echo "Version mismatch! in-image=${IMG_VER} tag=${VERSION}" >&2
            exit 1
          fi
          echo "✅ In-image Caddy version matches tag version (${VERSION})"

      # Guards against config/plugin drift: a directive from a plugin that is
      # not compiled in makes Caddy fail at config load.
      - name: Validate committed config against built image
        if: matrix.variant.verify
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          IMG="ghcr.io/nuln/caddy:${VERSION}"
          docker pull --platform linux/amd64 "$IMG"
          # dummy credentials: only config parsing/provisioning is checked, no API calls
          export CF_DNS_API_TOKEN=$(printf 'a%.0s' {1..40})
          export ALIDNS_AK="LTAI$(printf 'b%.0s' {1..16})"
          export ALIDNS_SK=$(printf 'c%.0s' {1..32})
          fail=0
          check() {
            local name="$1"; shift
            if out=$(docker run --rm --platform linux/amd64 \
              -v "$PWD/caddy:/etc/caddy:ro" \
              -e CF_DNS_API_TOKEN -e ALIDNS_AK -e ALIDNS_SK \
              "$IMG" "$@" 2>&1) && grep -q "Valid configuration" <<<"$out"; then
              echo "✅ $name"
            else
              echo "❌ $name"
              tail -n 5 <<<"$out" >&2
              fail=1
            fi
          }
          check "Caddyfile"           caddy validate --config /etc/caddy/Caddyfile
          check "conf/l4.json"        caddy validate --config /etc/caddy/conf/l4.json
          for f in caddy/conf/*.caddy; do
            check "$f" caddy validate --adapter caddyfile --config "/etc/caddy/${f#caddy/}"
          done
          exit $fail
