name: pi.dev

on:
  push:
    branches: [master]
    paths:
      - "pi.dev/**"
      - ".github/workflows/pi.dev.yml"
  pull_request:
    paths:
      - "pi.dev/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Pi version to bake (empty = npm latest)"
        required: false
        default: ""
      s6_version:
        description: "S6 overlay version to bake (empty = Dockerfile ARG)"
        required: false
        default: ""
      wrangler_version:
        description: "wrangler version to bake (empty = Dockerfile ARG)"
        required: false
        default: ""
      gh_version:
        description: "gh CLI version to bake (empty = Dockerfile ARG)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      image: ${{ steps.iv.outputs.image }}
    steps:
      - name: Determine Pi version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(npm view @earendil-works/pi-coding-agent version 2>/dev/null)
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to fetch @earendil-works/pi-coding-agent version" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Baking Pi version: ${VERSION}"

  build:
    needs: version
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/nuln/pi.dev:${{ needs.version.outputs.version }}
    outputs:
      image: ghcr.io/nuln/pi.dev:${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tool versions (dispatch input > Dockerfile ARG)
        id: tools
        run: |
          ARG() {
            awk -v k="$1" '$1=="ARG"{split($2,a,"="); if(a[1]==k){print a[2]; exit}}' pi.dev/Dockerfile
          }
          S6="${{ github.event.inputs.s6_version }}"; [ -n "$S6" ] || S6=$(ARG S6_OVERLAY_VERSION)
          WR="${{ github.event.inputs.wrangler_version }}"; [ -n "$WR" ] || WR=$(ARG WRANGLER_VERSION)
          GH="${{ github.event.inputs.gh_version }}"; [ -n "$GH" ] || GH=$(ARG GH_VERSION)
          [ -n "$S6" ] && [ -n "$WR" ] && [ -n "$GH" ] || { echo "Could not resolve s6/wrangler/gh versions" >&2; exit 1; }
          echo "Resolved -> s6=$S6 wrangler=$WR gh=$GH"
          echo "s6=${S6}" >> "$GITHUB_OUTPUT"
          echo "wrangler=${WR}" >> "$GITHUB_OUTPUT"
          echo "gh=${GH}" >> "$GITHUB_OUTPUT"

      - name: Build and push pi.dev image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: pi.dev
          file: pi.dev/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/nuln/pi.dev:latest
            ghcr.io/nuln/pi.dev:${{ needs.version.outputs.version }}
          build-args: |
            PI_VERSION=${{ needs.version.outputs.version }}
            S6_OVERLAY_VERSION=${{ steps.tools.outputs.s6 }}
            WRANGLER_VERSION=${{ steps.tools.outputs.wrangler }}
            GH_VERSION=${{ steps.tools.outputs.gh }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test & version verification (amd64 default runner)
        run: |
          docker run --rm --entrypoint bash \
            -e PI_EXPECT="${{ needs.version.outputs.version }}" \
            -e WR_EXPECT="${{ steps.tools.outputs.wrangler }}" \
            -e GH_EXPECT="${{ steps.tools.outputs.gh }}" \
            ${{ env.IMAGE }} -c '
            set -euo pipefail
            GOT="$(pi --version)"
            case "$GOT" in
              *"$PI_EXPECT"*) echo "PASS: pi --version=$GOT matches $PI_EXPECT" ;;
              *) echo "FAIL: pi --version=$GOT != $PI_EXPECT"; exit 1 ;;
            esac
            echo "wrangler -> $(wrangler --version)"
            case "$(wrangler --version)" in
              *"$WR_EXPECT"*) echo "PASS: wrangler matches $WR_EXPECT" ;;
              *) echo "WARN: wrangler $(wrangler --version) != $WR_EXPECT" ;;
            esac
            echo "gh -> $(gh --version | head -1)"
            case "$(gh --version | head -1)" in
              *"$GH_EXPECT"*) echo "PASS: gh matches $GH_EXPECT" ;;
              *) echo "WARN: gh $(gh --version | head -1) != $GH_EXPECT" ;;
            esac
          '
          docker run --rm --entrypoint bash ${{ env.IMAGE }} -c 'jq -e '\''.packages | all(startswith("/home/pi/.pi-plugins/"))'\'' /home/pi/.pi-plugins/settings.json >/dev/null && echo "baked plugins absolute paths ok"'

  # Verify each on-demand toolchain installs and runs from a fresh bash -c (BASH_ENV path).
  # The verifier is written to the container at run time (no script files in the repo).
  toolchain:
    name: Verify ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go
            tools: go
          - name: rust
            tools: rust
          - name: java
            tools: java
          - name: bun-node
            tools: bun node-tools
          - name: scala
            tools: scala
          - name: kotlin
            tools: kotlin
          - name: lua-php
            tools: lua php
    steps:
      - uses: actions/checkout@v7

      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ needs.build.outputs.image }}

      - name: Run install.sh and verify (${{ matrix.tools }})
        run: |
          docker run --rm -i --entrypoint bash \
            ${{ needs.build.outputs.image }} -s ${{ matrix.tools }} <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          # Pinned versions baked into the image (single source of truth)
          . /etc/s6-overlay/scripts/install.d/versions.env
          for t in "$@"; do
            echo "== installing $t =="
            install.sh "$t"
          done
          check() {
            local bin="$1"; shift
            echo "== check $bin =="
            bash -c "command -v $bin" >/dev/null || { echo "FAIL: $bin not on PATH in bash -c (BASH_ENV not loading?)"; return 1; }
            bash -c "$bin $*" 2>&1 | head -2 || true
            echo "PASS: $bin"
          }
          has_ver() { # check <bin> <expected-substring> [args...]
            local bin="$1" want="$2"; shift 2
            echo "== version check: $bin wants '$want' =="
            local got
            got="$(bash -c "$bin $*" 2>&1 | head -3)"
            case "$got" in
              *"$want"*) echo "PASS: $bin  ($got | grep '$want')" ;;
              *) echo "WARN: $bin output '$got' does not contain '$want' (versions.env drift?)" ;;
            esac
          }
          for t in "$@"; do
            case "$t" in
              go)         check go version;         has_ver go "$GO_VERSION" version ;;
              rust)       check rustc --version; check cargo --version; has_ver rustc "$RUST_VERSION" --version; has_ver cargo "$RUST_VERSION" --version ;;
              java)       check java -version; has_ver java "$JAVA_VERSION" -version ;;
              bun)        check bun --version; has_ver bun "$BUN_VERSION" --version ;;
              scala)      check scala-cli version; has_ver scala-cli "$SCALA_CLI_VERSION" version ;;
              kotlin)     check kotlin -version; has_ver kotlin "$KOTLIN_VERSION" -version ;;
              node-tools) check tsc --version; has_ver tsc "$TYPESCRIPT_VERSION" --version ;;
              lua)        check lua -v; has_ver lua "$LUA_VERSION" -v ;;
              php)        check php -v; has_ver php "$PHP_VERSION" -v ;;
              *)          echo "WARN: no assertion defined for $t" ;;
            esac
          done
          echo "ALL TOOLCHAINS OK: $*"
          SCRIPT

  # First-boot integration test: the s6 /init must run the user bundle (wire the baked
  # plugin store into the mounted agent dir via absolute-path settings.json, auto-start the
  # Web UI daemon on :3141) and not re-write settings on the second boot.
  integration:
    name: First-boot (s6 wire-plugins + web autostart)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ needs.build.outputs.image }}

      - name: First boot — wire baked plugins + web autostart
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          chmod 777 "$TMP"
          IMG="${{ needs.build.outputs.image }}"
          # write the verifier once on the host; docker cp it into each container (no repo script files)
          cat > "$RUNNER_TEMP/verify.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          AGENT=/home/pi/.pi/agent
          CFG="$AGENT/settings.json"

          echo "== [1] settings.json wired by wire-plugins =="
          test -e "$CFG" || { echo "FAIL: $CFG missing"; exit 1; }
          echo "PASS: settings.json exists"

          echo "== [2] absolute baked-store paths, all dirs exist =="
          COUNT="$(jq '.packages | length' "$CFG")"
          [ "$COUNT" -ge 14 ] || { echo "FAIL: only $COUNT packages"; exit 1; }
          while IFS= read -r p; do
            case "$p" in
              /home/pi/.pi-plugins/*) ;;
              *) echo "FAIL: not a baked path: $p"; exit 1 ;;
            esac
            [ -d "$p" ] || { echo "FAIL: missing baked dir: $p"; exit 1; }
          done < <(jq -r '.packages[]' "$CFG")
          echo "PASS: $COUNT absolute paths, dirs exist"

          echo "== [3] pi list resolves EXACTLY the configured packages =="
          PI_CODING_AGENT_DIR="$AGENT" pi list >/tmp/pilist.txt 2>&1
          LIST_COUNT="$(grep -c '^  /home/pi/.pi-plugins/' /tmp/pilist.txt || true)"
          CFG_COUNT="$(jq '.packages | length' "$CFG")"
          [ "$LIST_COUNT" -eq "$CFG_COUNT" ] || { echo "FAIL: pi resolved $LIST_COUNT, configured $CFG_COUNT"; exit 1; }
          echo "PASS: $LIST_COUNT == configured $CFG_COUNT"

          echo "== [4] every plugin manifest entry (extensions/skills/prompts/themes) exists =="
          FAIL=0
          while IFS= read -r p; do
            jq -e '.pi' "$p/package.json" >/dev/null 2>&1 || { echo "FAIL: no pi manifest in $p"; FAIL=1; continue; }
            for key in extensions skills prompts themes; do
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                [ -e "$p/$f" ] && continue
                case "$f" in
                  *"../"*) echo "WARN: $key '$f' in $p points outside pkg (skip)";;
                  *) echo "FAIL: missing $key '$f' in $p"; FAIL=1;;
                esac
              done < <(jq -r ".pi.$key | if type==\"array\" then .[] else . end | select(. != null)" "$p/package.json" 2>/dev/null)
            done
          done < <(jq -r '.packages[]' "$CFG")
          [ "$FAIL" -eq 0 ] || { echo "FAIL: plugin manifest check"; exit 1; }
          echo "PASS: every plugin manifest resolves"

          echo "== [5] settings.json owned by pi (uid 1000), readable by pi =="
          OWNER="$(stat -c '%u:%g' "$CFG")"
          [ "$OWNER" = "1000:1000" ] || { echo "FAIL: owner $OWNER"; exit 1; }
          su -s /bin/bash pi -c "test -r $CFG" || { echo "FAIL: pi cannot read $CFG"; exit 1; }
          echo "PASS: owner $OWNER, pi readable"

          echo "== [6] s6 oneshots ran: pi-web.log written by pi-web, settings by wire-plugins =="
          LOG="$AGENT/pi-web.log"
          for i in $(seq 1 40); do
            [ -s "$LOG" ] && break
            sleep 2
          done
          test -s "$LOG" || { echo "FAIL: $LOG missing/empty — pi-web oneshot did not run"; exit 1; }
          echo "PASS: pi-web oneshot ran (log present)"
          S6RC="$(command -v s6-rc 2>/dev/null || true)"; [ -n "$S6RC" ] || S6RC=/command/s6-rc
          if [ -x "$S6RC" ]; then
            "$S6RC" -l listall | grep -qE 'pi-web|wire-plugins' || { echo "WARN: services absent from s6-rc listall"; }
          else
            echo "WARN: s6-rc unavailable — skipped listall check"
          fi

          echo "== [7] base commands usable =="
          pi --version >/dev/null || { echo "FAIL: pi --version"; exit 1; }
          install.sh --help >/dev/null 2>&1 || { echo "FAIL: install.sh --help"; exit 1; }
          echo "PASS: pi + install.sh OK"

          echo "ALL PLUGIN CHECKS OK"
          SCRIPT

          docker run -d --name pi-it -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 60'
          sleep 8
          for i in $(seq 1 30); do
            docker exec pi-it test -e /home/pi/.pi/agent/settings.json && break
            sleep 2
          done
          docker cp "$RUNNER_TEMP/verify.sh" pi-it:/tmp/verify.sh
          docker exec pi-it bash /tmp/verify.sh

          # wire-plugins must have run exactly once on this boot
          GEN_COUNT="$(docker logs pi-it 2>&1 | grep -c 'generated.*baked plugins' || true)"
          [ "$GEN_COUNT" -eq 1 ] || { echo "FAIL: wire-plugins generated $GEN_COUNT times (expected 1)"; exit 1; }
          echo "PASS: wire-plugins ran exactly once"

          # Web UI daemon listening on :3141 with a non-empty body
          CODE=""
          for i in $(seq 1 15); do
            CODE="$(docker exec pi-it bash -c 'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3141' 2>/dev/null || true)"
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "web http=$CODE"
          test "$CODE" = "200"
          BODY="$(docker exec pi-it bash -c 'curl -s http://127.0.0.1:3141' 2>/dev/null || true)"
          [ -n "$BODY" ] || { echo "FAIL: web returned empty body"; exit 1; }
          echo "PASS: web body non-empty ($(printf '%s' "$BODY" | wc -c) bytes)"
          docker rm -f pi-it >/dev/null

      - name: Second boot — user-modified settings is preserved
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          chmod 777 "$TMP"
          IMG="${{ needs.build.outputs.image }}"
          docker run -d --name pi-it1 -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 20'
          sleep 10
          docker cp "$RUNNER_TEMP/verify.sh" pi-it1:/tmp/verify.sh
          docker exec pi-it1 bash /tmp/verify.sh && echo "BOOT1 WIRED OK"
          # user edits settings.json (add a marker) — must survive a restart
          docker exec pi-it1 bash -c 'jq ". + {userMark:\"keep-me\"}" /home/pi/.pi/agent/settings.json > /tmp/s2.json && mv /tmp/s2.json /home/pi/.pi/agent/settings.json'
          docker rm -f pi-it1 >/dev/null
          docker run -d --name pi-it2 -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 20'
          sleep 10
          docker cp "$RUNNER_TEMP/verify.sh" pi-it2:/tmp/verify.sh
          docker exec pi-it2 bash /tmp/verify.sh && echo "BOOT2 PERSIST OK"
          docker exec pi-it2 bash -c 'jq -e ".userMark == \"keep-me\"" /home/pi/.pi/agent/settings.json >/dev/null' \
            && echo "PASS: user marker preserved after restart" \
            || { echo "FAIL: user-modified settings.json was overwritten"; exit 1; }
          docker rm -f pi-it2 >/dev/null

  # opencode provider auto-config (pi-provider): the oneshot applies the baked
  # provider templates into a fresh agent dir. Full behavioural coverage of
  # providers.sh (rebuild/append/rename/corruption) is exercised here with a
  # FAKE key only — never with a real OPENCODE_API_KEY. The only network call is
  # the auto Go-subscription probe, which resolves to "not subscribed" for a
  # dummy key (or is skipped when the runner has no egress) — both are safe.
  providers:
    name: Providers (opencode template auto-config)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ needs.build.outputs.image }}

      - name: providers.sh behaviour (fake key, in-container, per-scenario)
        run: |
          set -euo pipefail
          IMG="${{ needs.build.outputs.image }}"
          RUNNER_ID="${{ github.run_id }}"
          FAKE_KEY="ci-dummy-opencode-key-${RUNNER_ID}"

          cat > "$RUNNER_TEMP/providers_test.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          TPL=/etc/s6-overlay/providers/opencode
          TD=/tmp/ag
          SCRIPT=/etc/s6-overlay/scripts/providers.sh
          KEY="${FAKE_KEY:-ci-dummy-opencode-key}"
          run() {
            local arg="${1:-auto}"; shift || true
            PI_CODING_AGENT_DIR="$TD" PI_PROVIDER_TPL_DIR="$TPL" \
            OPENCODE_API_KEY="$KEY" su -s /bin/bash pi -c "bash $SCRIPT $arg $*" >/dev/null 2>&1
          }
          new() { rm -rf "$TD"; mkdir -p "$TD"; chown 1000:1000 "$TD"; }
          mkeys() { jq -c '.providers|keys' "$TD/models.json" 2>/dev/null || echo NO_MODELS; }
          akeys() { jq -c 'keys' "$TD/auth.json" 2>/dev/null || echo NO_AUTH; }
          ck() { if [ "$2" = "$3" ]; then echo "  PASS: $1"; else echo "  FAIL: $1 (got '$2' want '$3')"; exit 1; fi; }

          echo "== [1] templates valid (free=8, go=7) =="
          test -f "$TPL/opencode-free.json" || { echo "FAIL: free template missing"; exit 1; }
          test -f "$TPL/opencode-go.json"   || { echo "FAIL: go template missing"; exit 1; }
          ck "free models" "$(jq '.providers["opencode+free"].models|length' "$TPL/opencode-free.json")" "8"
          ck "go models"   "$(jq '.providers["opencode+go"].models|length'   "$TPL/opencode-go.json")"   "7"

          echo "== [2] bash syntax =="
          bash -n "$SCRIPT" || { echo "FAIL: syntax"; exit 1; }
          echo "  PASS: syntax"

          echo "== [3] first boot, --no: full rebuild, free only =="
          new; run --no
          ck "models keys" "$(mkeys)" '["opencode+free"]'
          ck "auth keys"   "$(akeys)" '["opencode+free"]'
          ck "free=8" "$(jq '.providers["opencode+free"].models|length' "$TD/models.json")" "8"
          ck "no go key" "$(jq 'has("opencode+go")' "$TD/auth.json")" "false"

          echo "== [4] first boot, --go forced: free + go =="
          new; run --go
          ck "models keys" "$(mkeys)" '["opencode+free","opencode+go"]'
          ck "go=7" "$(jq '.providers["opencode+go"].models|length' "$TD/models.json")" "7"

          echo "== [5] append: go already present, re-subscribe -> go-2 =="
          new; run --go; run --go
          ck "go-2 added" "$(jq -c '.providers|keys|sort' "$TD/models.json")" '["opencode+free","opencode+go","opencode+go-2"]'
          ck "auth has go-2" "$(jq -c 'keys|sort' "$TD/auth.json")" '["opencode+free","opencode+go","opencode+go-2"]'

          echo "== [6] third subscription -> go-3 =="
          run --go
          ck "go-3 added" "$(jq -c '.providers|keys|sort' "$TD/models.json")" '["opencode+free","opencode+go","opencode+go-2","opencode+go-3"]'

          echo "== [7] custom provider preserved =="
          new; run --go
          printf '%s' '{"providers":{"opencode+free":{"models":[]},"my-ollama":{"models":[{"id":"local"}]}}}' > "$TD/models.json"
          printf '%s' '{"opencode+free":{"type":"api_key","key":"k"}}' > "$TD/auth.json"
          chown 1000:1000 "$TD/models.json" "$TD/auth.json"
          run --no
          ck "my-ollama kept" "$(jq -c '.providers|has("my-ollama")' "$TD/models.json")" "true"

          echo "== [8] corrupt models.json left untouched =="
          new; printf 'garbage' > "$TD/models.json"; chown 1000:1000 "$TD/models.json"
          run --no
          ck "kept garbage" "$(cat "$TD/models.json")" "garbage"

          echo "== [9] corrupt auth.json left untouched =="
          new; run --no
          printf 'garbage' > "$TD/auth.json"; chown 1000:1000 "$TD/auth.json"
          rm -f "$TD/models.json"
          run --no
          ck "auth kept garbage" "$(cat "$TD/auth.json")" "garbage"

          echo "== [10] no key -> nothing written =="
          new
          PI_CODING_AGENT_DIR="$TD" PI_PROVIDER_TPL_DIR="$TPL" OPENCODE_API_KEY= \
            su -s /bin/bash pi -c "bash $SCRIPT auto" >/dev/null 2>&1
          ck "models absent" "$(test -f "$TD/models.json" && echo exists || echo absent)" "absent"

          echo "== [11] top-level keys preserved across append =="
          new; run --no
          printf '%s' '{"default-model":"o3","providers":{"opencode+free":{"models":["x"]}}}' > "$TD/models.json"
          chown 1000:1000 "$TD/models.json"
          run --go
          ck "default-model kept" "$(jq -r '."default-model"' "$TD/models.json")" "o3"

          echo "== [12] status runs =="
          PI_CODING_AGENT_DIR="$TD" PI_PROVIDER_TPL_DIR="$TPL" OPENCODE_API_KEY="$KEY" \
            su -s /bin/bash pi -c "bash $SCRIPT status" >/dev/null 2>&1
          echo "  PASS: status exit 0"

          echo "ALL PROVIDERS CHECKS OK"
          SCRIPT

          CID="$(docker run -d --name pi-prov-agent-${RUNNER_ID} "$IMG" bash -c 'sleep 120')"
          docker cp "$RUNNER_TEMP/providers_test.sh" "$CID:/tmp/providers_test.sh"
          docker exec "$CID" env FAKE_KEY="$FAKE_KEY" bash /tmp/providers_test.sh
          docker rm -f "$CID" >/dev/null

      - name: s6 oneshot pi-provider runs on boot (no key -> skipped, no breakage)
        run: |
          set -euo pipefail
          IMG="${{ needs.build.outputs.image }}"
          TMP="$(mktemp -d)"; chmod 777 "$TMP"
          docker run -d --name pi-prov-s6 -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 45'
          sleep 12
          docker exec pi-prov-s6 sh -c 's6-rc -l listall 2>/dev/null | grep -q pi-provider' \
            || echo "WARN: pi-provider not listed (s6-rc listall)"
          docker exec pi-prov-s6 test -x /etc/s6-overlay/scripts/providers.sh \
            || { echo "FAIL: providers.sh not executable"; exit 1; }
          docker exec pi-prov-s6 test -f /etc/s6-overlay/providers/opencode/opencode-free.json \
            || { echo "FAIL: free template missing in image"; exit 1; }
          # no OPENCODE_API_KEY set -> providers.sh must no-op, not crash the boot
          docker logs pi-prov-s6 2>&1 | grep -q 'pi-provider' \
            && echo "WARN: pi-provider log seen" || echo "PASS: boot proceeded (no key)"
          docker rm -f pi-prov-s6 >/dev/null

  # Baked-skills gate: PI_SKILLS (default off) controls whether the 33 curated
  # skills baked at /etc/s6-overlay/plugins/skills are copied into pi's global
  # skills dir (~/.agents/skills). Verify default-off means NOT loaded, and
  # PI_SKILLS=true means every skill lands with a readable SKILL.md.
  skills:
    name: Skills (PI_SKILLS gate)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ needs.build.outputs.image }}

      - name: Default boot — skills must NOT be loaded
        run: |
          set -euo pipefail
          IMG="${{ needs.build.outputs.image }}"
          TMP="$(mktemp -d)"; chmod 777 "$TMP"
          docker run -d --name pi-sk-def -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 30'
          sleep 12
          if docker exec pi-sk-def test -d /home/pi/.agents/skills; then
            echo "FAIL: ~/.agents/skills exists even with PI_SKILLS unset"
            docker exec pi-sk-def sh -c 'ls -la /home/pi/.agents/skills' || true
            exit 1
          fi
          echo "PASS: skills NOT loaded by default"
          docker rm -f pi-sk-def >/dev/null

      - name: PI_SKILLS=true — all baked skills copied and readable
        run: |
          set -euo pipefail
          IMG="${{ needs.build.outputs.image }}"
          TMP="$(mktemp -d)"; chmod 777 "$TMP"
          docker run -d --name pi-sk-on -e PI_SKILLS=true -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 45'
          for i in $(seq 1 30); do
            docker exec pi-sk-on test -d /home/pi/.agents/skills && break
            sleep 2
          done
          docker exec pi-sk-on test -d /home/pi/.agents/skills || { echo "FAIL: ~/.agents/skills missing"; exit 1; }

          # verify.sh asserts: every top-level dir has a SKILL.md with a name field,
          # owned by pi (uid 1000), and readable by pi.
          cat > "$RUNNER_TEMP/skills_verify.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          SK=/home/pi/.agents/skills
          DIRS=$(find "$SK" -maxdepth 1 -mindepth 1 -type d | wc -l | tr -d ' ')
          [ "$DIRS" -eq 33 ] || { echo "FAIL: expected 33 skills, found $DIRS"; exit 1; }
          echo "PASS: $DIRS skill dirs copied"
          FAIL=0
          for d in "$SK"/*/; do
            [ -f "$d/SKILL.md" ] || { echo "FAIL: no SKILL.md in $d"; FAIL=1; continue; }
            grep -q '^name:' "$d/SKILL.md" || { echo "FAIL: SKILL.md lacks name: in $d"; FAIL=1; continue; }
            grep -q '^description:' "$d/SKILL.md" || { echo "FAIL: SKILL.md lacks description: in $d"; FAIL=1; continue; }
          done
          [ "$FAIL" -eq 0 ] || exit 1
          echo "PASS: every skill has SKILL.md with name+description"
          OWNER=$(stat -c '%u:%g' "$SK")
          [ "$OWNER" = "1000:1000" ] || { echo "FAIL: skills dir owner $OWNER"; exit 1; }
          su -s /bin/bash pi -c "test -r $SK/tdd/SKILL.md" || { echo "FAIL: pi cannot read SKILL.md"; exit 1; }
          su -s /bin/bash pi -c "ls $SK >/dev/null" || { echo "FAIL: pi cannot list skills dir"; exit 1; }
          echo "PASS: skills owned by pi (1000:1000), readable+listable by pi"
          echo "SKILLS OK"
          SCRIPT

          docker cp "$RUNNER_TEMP/skills_verify.sh" pi-sk-on:/tmp/skills_verify.sh
          docker exec pi-sk-on bash /tmp/skills_verify.sh

          # wire-plugins reported the copy exactly once
          GEN="$(docker logs pi-sk-on 2>&1 | grep -c 'baked skills ->' || true)"
          [ "$GEN" -eq 1 ] || { echo "FAIL: skills copied $GEN times (expected 1)"; exit 1; }
          echo "PASS: skills copied exactly once"
          docker rm -f pi-sk-on >/dev/null

      - name: PI_SKILLS whitelist — only requested skills copied
        run: |
          set -euo pipefail
          IMG="${{ needs.build.outputs.image }}"
          TMP="$(mktemp -d)"; chmod 777 "$TMP"
          docker run -d --name pi-sk-wl -e PI_SKILLS=tdd,browser,no-such-skill \
            -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 45'
          for i in $(seq 1 30); do
            docker exec pi-sk-wl test -d /home/pi/.agents/skills && break
            sleep 2
          done
          docker exec pi-sk-wl test -d /home/pi/.agents/skills || { echo "FAIL: ~/.agents/skills missing"; exit 1; }
          COUNT="$(docker exec pi-sk-wl sh -c 'ls -d /home/pi/.agents/skills/*/ | wc -l' | tr -d ' ')"
          [ "$COUNT" -eq 2 ] || { echo "FAIL: expected 2 skills loaded (tdd,browser), got $COUNT"; docker exec pi-sk-wl ls /home/pi/.agents/skills; exit 1; }
          docker exec pi-sk-wl test -d /home/pi/.agents/skills/tdd || { echo "FAIL: tdd missing"; exit 1; }
          docker exec pi-sk-wl test -d /home/pi/.agents/skills/browser || { echo "FAIL: browser missing"; exit 1; }
          docker exec pi-sk-wl test -d /home/pi/.agents/skills/research && { echo "FAIL: research loaded though not whitelisted"; exit 1; }
          echo "PASS: whitelist loaded tdd+browser only, unknown name skipped"
          docker rm -f pi-sk-wl >/dev/null

  # Scaffold + healthcheck: new-project bakes templates with {{ PROJECT }}
  # placeholders, and the image HEALTHCHECK must report healthy once the web UI
  # autostart is up.
  scaffold:
    name: Scaffold + healthcheck
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ needs.build.outputs.image }}

      - name: new-project scaffolds templates (placeholder substitution)
        run: |
          set -euo pipefail
          IMG="${{ needs.build.outputs.image }}"
          TMP="$(mktemp -d)"; chmod 777 "$TMP"
          docker run -d --name pi-scaf -v "$TMP:/home/pi/dev" "$IMG" bash -c 'sleep 60'
          sleep 8
          docker exec pi-scaf new-project --list
          docker exec pi-scaf new-project go my-api >/tmp/scaf.out 2>&1 || { cat /tmp/scaf.out; exit 1; }
          docker exec pi-scaf test -f /home/pi/dev/my-api/main.go || { echo "FAIL: main.go missing"; exit 1; }
          docker exec pi-scaf grep -q '"my-api"' /home/pi/dev/my-api/main.go || { echo "FAIL: {{ PROJECT }} not substituted"; exit 1; }
          docker exec pi-scaf new-project worker cf-app >/tmp/scaf2.out 2>&1 || { cat /tmp/scaf2.out; exit 1; }
          docker exec pi-scaf test -f /home/pi/dev/cf-app/wrangler.jsonc || { echo "FAIL: wrangler.jsonc missing"; exit 1; }
          docker exec pi-scaf grep -q 'name = "cf-app"' /home/pi/dev/cf-app/wrangler.jsonc || { echo "FAIL: wrangler placeholder not substituted"; exit 1; }
          docker exec pi-scaf test -f /home/pi/dev/cf-app/README.md || { echo "FAIL: README.md.tpl suffix not stripped"; exit 1; }
          # every language template must scaffold (node rust python) with substitution
          for t in rust node python; do
            docker exec pi-scaf new-project "$t" "proj-$t" >/dev/null 2>&1 || { echo "FAIL: scaffold $t"; exit 1; }
            docker exec pi-scaf test -d "/home/pi/dev/proj-$t" || { echo "FAIL: no dir for $t"; exit 1; }
          done
          docker exec pi-scaf new-project no-such-template >/tmp/scaf3.out 2>&1 && { echo "FAIL: unknown template should error"; exit 1; }
          echo "PASS: new-project scaffolds go + worker + rust/node/python, placeholders + .tpl stripped"
          docker rm -f pi-scaf >/dev/null

      - name: Credentials persist via PI_CREDS_DIR mount (multi-tool)
        run: |
          set -euo pipefail
          IMG="${{ needs.build.outputs.image }}"
          TMP="$(mktemp -d)"; chmod 777 "$TMP"
          mkdir -p "$TMP/.config/gh" "$TMP/.ssh" "$TMP/.docker"
          # pre-seed credentials on the HOST mount (as if logged in previously)
          printf 'github.com:\n  oauth_token: tok123\n  user: me\n' > "$TMP/.config/gh/hosts.yml"
          printf '//registry.npmjs.org/:_authToken=npm-tok\n' > "$TMP/.npmrc"
          printf '{\n  "auths":{"https://index.docker.io/v1/":{"auth":"ZHVt(secret)"}}\n}\n' > "$TMP/.docker/config.json"
          printf 'ssh-rsa AAAAB3Nz... pi@host\n' > "$TMP/.ssh/id_rsa.pub"
          docker run -d --name pi-creds \
            -e PI_CREDS_DIR=/home/pi/.creds \
            -v "$TMP:/home/pi/.creds" \
            "$IMG" bash -c 'sleep 60'
          sleep 14
          # layered symlinks all wired (deep config dirs + flat dotfiles + nested cache files)
          for L in /home/pi/.config /home/pi/.ssh /home/pi/.docker /home/pi/.npmrc /home/pi/.gitconfig /home/pi/.cargo/credentials.toml; do
            docker exec pi-creds sh -c "test -L $L" \
              || { echo "FAIL: $L not symlinked"; exit 1; }
          done
          # pre-seeded creds visible through the symlinks inside the container
          docker exec pi-creds sh -c 'grep -q tok123 /home/pi/.config/gh/hosts.yml' \
            || { echo "FAIL: gh host not visible via symlink"; exit 1; }
          docker exec pi-creds sh -c 'grep -q npm-tok /home/pi/.npmrc' \
            || { echo "FAIL: npmrc not visible via symlink"; exit 1; }
          docker exec pi-creds sh -c 'grep -q index.docker.io /home/pi/.docker/config.json' \
            || { echo "FAIL: docker config not visible via symlink"; exit 1; }
          # write-through: login writes INSIDE container -> lands on host mount
          docker exec pi-creds bash -c 'echo "//npm.pkg.github.com/:_authToken=ghp_extra" >> /home/pi/.npmrc' 2>/dev/null || true
          docker exec pi-creds sh -c 'printf "token new-tok\n" > /home/pi/.cargo/credentials.toml'
          grep -q "ghp_extra" "$TMP/.npmrc" || { echo "FAIL: new npm token did not reach host"; exit 1; }
          grep -q "new-tok" "$TMP/.cargo/credentials.toml" || { echo "FAIL: cargo credentials did not reach host"; exit 1; }
          echo "PASS: credentials wired into PI_CREDS_DIR, layered symlinks + write-through confirmed"
          docker rm -f pi-creds >/dev/null

      - name: install.sh gc (cache cleanup)
        run: |
          set -euo pipefail
          IMG="${{ needs.build.outputs.image }}"
          TMP="$(mktemp -d)"; chmod 777 "$TMP"
          mkdir -p "$TMP/go" "$TMP/rust"
          docker run -d --name pi-gc -v "$TMP:/home/pi/cache" "$IMG" bash -c 'sleep 30'
          sleep 6
          OUT="$(docker exec pi-gc install.sh gc)"
          echo "$OUT"
          echo "$OUT" | grep -qE 'go|rust' || { echo "FAIL: gc list should show cached tools"; exit 1; }
          docker exec pi-gc install.sh gc go >/dev/null
          docker exec pi-gc test ! -d /home/pi/cache/go || { echo "FAIL: go not removed"; exit 1; }
          docker exec pi-gc test -d /home/pi/cache/rust || { echo "FAIL: rust should remain"; exit 1; }
          echo "PASS: install.sh gc removes selected tools"
          docker rm -f pi-gc >/dev/null

      - name: skills command (self-check) reflects loaded set
        run: |
          set -euo pipefail
          IMG="${{ needs.build.outputs.image }}"
          TMP="$(mktemp -d)"; chmod 777 "$TMP"
          docker run -d --name pi-sk-cmd -e PI_SKILLS=tdd,browser \
            -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 60'
          sleep 12
          docker exec pi-sk-cmd sh -c 'skills | grep -q tdd' || { echo "FAIL: skills list missing tdd"; exit 1; }
          docker exec pi-sk-cmd sh -c 'skills | grep -q browser' || { echo "FAIL: skills list missing browser"; exit 1; }
          docker exec pi-sk-cmd sh -c 'skills research && exit 1 || exit 0' || { echo "FAIL: research should not be loaded"; exit 1; }
          echo "PASS: skills command shows loaded set"
          docker rm -f pi-sk-cmd >/dev/null

      - name: HEALTHCHECK present + healthy with web autostart
        run: |
          set -euo pipefail
          IMG="${{ needs.build.outputs.image }}"
          TMP="$(mktemp -d)"; chmod 777 "$TMP"
          docker run -d --name pi-hc -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 300'
          for i in $(seq 1 40); do
            ST="$(docker inspect -f '{{.State.Health.Status}}' pi-hc 2>/dev/null || echo starting)"
            [ "$ST" = "healthy" ] && break
            sleep 3
          done
          echo "health status: $ST"
          [ "$ST" = "healthy" ] || { echo "FAIL: healthcheck not healthy"; docker logs pi-hc 2>&1 | tail -20; exit 1; }
          echo "PASS: HEALTHCHECK reports healthy"

          # pi-watchdog longrun must be present and supervising
          docker exec pi-hc bash -c 's6-rc -l listall 2>/dev/null | grep -q pi-watchdog' \
            || echo "WARN: pi-watchdog not listed by s6-rc"
          docker exec pi-hc sh -c 'test -x /etc/s6-overlay/s6-rc.d/pi-watchdog/run' \
            || { echo "FAIL: pi-watchdog run script missing"; exit 1; }
          echo "PASS: pi-watchdog service files present"

          # === actual self-healing: kill the web daemon, watchdog must relaunch ===
          # daemon cmdline is node .../pi-web-chat/dist/index.js (not literally "pi --web")
          WEB_PID="$(docker exec pi-hc sh -c 'ps -ef | grep "pi-web-chat" | grep -v grep || true' | awk '{print $2}' | head -1)"
          if [ -z "$WEB_PID" ]; then
            echo "WARN: could not find pi-web-chat process; skip self-heal kill (still asserting watchdog presence)"
          else
            echo "killing web daemon pid $WEB_PID"
            docker exec pi-hc kill "$WEB_PID"
            # wait for watchdog to detect + relaunch (interval 30s default -> allow ~80s)
            RECOVERED=""
            for i in $(seq 1 27); do
              sleep 3
              NEW_PID="$(docker exec pi-hc sh -c 'ps -ef | grep "pi-web-chat" | grep -v grep || true' | awk '{print $2}' | head -1)"
              [ -n "$NEW_PID" ] && [ "$NEW_PID" != "$WEB_PID" ] && { RECOVERED=1; break; }
            done
            [ -n "$RECOVERED" ] || { echo "FAIL: watchdog did not restart web daemon"; docker logs pi-hc 2>&1 | rg 'pi-watchdog' | tail -10; exit 1; }
            echo "PASS: watchdog self-healed (new pid $NEW_PID != old $WEB_PID)"
            docker exec pi-hc sh -c 'cat /home/pi/.pi/agent/pi-watchdog.json' 2>/dev/null \
              && echo "PASS: watchdog status file present" || echo "WARN: no status file"
          fi
          docker rm -f pi-hc >/dev/null

      - name: oh-my-zsh + default shell is zsh
        run: |
          set -euo pipefail
          IMG="${{ needs.build.outputs.image }}"
          docker run -d --name pi-zsh "$IMG" bash -c 'sleep 30'
          sleep 8
          shell="$(docker exec pi-zsh bash -c 'getent passwd pi | cut -d: -f7')"
          [ "$shell" = "/usr/bin/zsh" ] || { echo "FAIL: pi shell is $shell, expected /usr/bin/zsh"; exit 1; }
          echo "PASS: pi default shell is $shell"
          docker exec pi-zsh test -d /home/pi/.oh-my-zsh || { echo "FAIL: ~/.oh-my-zsh missing"; exit 1; }
          docker exec pi-zsh test -d /home/pi/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting || { echo "FAIL: highlight plugin missing"; exit 1; }
          docker exec pi-zsh test -d /home/pi/.oh-my-zsh/custom/plugins/zsh-autosuggestions || { echo "FAIL: autosuggest plugin missing"; exit 1; }
          echo "PASS: oh-my-zsh + plugins present"
          OUT="$(docker exec pi-zsh bash -c 'zsh -c "source /home/pi/.zshrc && echo zsh-ok" 2>&1')" \
            || { echo "FAIL: .zshrc load failed"; echo "$OUT"; exit 1; }
          echo "$OUT" | grep -q zsh-ok && echo "PASS: .zshrc loads cleanly"
          docker rm -f pi-zsh >/dev/null
