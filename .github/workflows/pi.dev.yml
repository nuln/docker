name: pi.dev

on:
  push:
    branches: [master]
    paths:
      - "pi.dev/**"
      - ".github/workflows/pi.dev.yml"
  pull_request:
    paths:
      - "pi.dev/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Pi version to bake (empty = npm latest)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      image: ${{ steps.iv.outputs.image }}
    steps:
      - name: Determine Pi version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(npm view @earendil-works/pi-coding-agent version 2>/dev/null)
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to fetch @earendil-works/pi-coding-agent version" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Baking Pi version: ${VERSION}"

  build:
    needs: version
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/nuln/pi.dev:${{ needs.version.outputs.version }}
    outputs:
      image: ghcr.io/nuln/pi.dev:${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pi.dev image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: pi.dev
          file: pi.dev/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/nuln/pi.dev:latest
            ghcr.io/nuln/pi.dev:${{ needs.version.outputs.version }}
          build-args: |
            PI_VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (amd64 default runner)
        run: |
          docker run --rm --entrypoint bash ${{ env.IMAGE }} -c 'pi --version'
          docker run --rm --entrypoint bash ${{ env.IMAGE }} -c 'jq -e '\''.packages | all(startswith("/home/pi/.pi-plugins/"))'\'' /home/pi/.pi-plugins/settings.json >/dev/null && echo "baked plugins absolute paths ok"'

  # Verify each on-demand toolchain installs and runs from a fresh bash -c (BASH_ENV path).
  # The verifier is written to the container at run time (no script files in the repo).
  toolchain:
    name: Verify ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go
            tools: go
          - name: rust
            tools: rust
          - name: java
            tools: java
          - name: bun-node
            tools: bun node-tools
          - name: scala
            tools: scala
          - name: kotlin
            tools: kotlin
          - name: lua-php
            tools: lua php
    steps:
      - uses: actions/checkout@v4

      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ needs.build.outputs.image }}

      - name: Run install.sh and verify (${{ matrix.tools }})
        run: |
          docker run --rm --entrypoint bash \
            ${{ needs.build.outputs.image }} bash -s ${{ matrix.tools }} <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          for t in "$@"; do
            echo "== installing $t =="
            install.sh "$t"
          done
          check() {
            local bin="$1"; shift
            echo "== check $bin =="
            bash -c "command -v $bin" >/dev/null || { echo "FAIL: $bin not on PATH in bash -c (BASH_ENV not loading?)"; return 1; }
            bash -c "$bin $*" 2>&1 | head -2 || true
            echo "PASS: $bin"
          }
          for t in "$@"; do
            case "$t" in
              go)         check go version ;;
              rust)       check rustc --version; check cargo --version ;;
              java)       check java -version ;;
              bun)        check bun --version ;;
              scala)      check scala-cli version ;;
              kotlin)     check kotlin -version ;;
              node-tools) check tsc --version ;;
              lua)        check lua -v ;;
              php)        check php -v ;;
              *)          echo "WARN: no assertion defined for $t" ;;
            esac
          done
          echo "ALL TOOLCHAINS OK: $*"
          SCRIPT

  # First-boot integration test: the s6 /init must run the user bundle (wire the baked
  # plugin store into the mounted agent dir via absolute-path settings.json, auto-start the
  # Web UI daemon on :3141) and not re-write settings on the second boot.
  integration:
    name: First-boot (s6 wire-plugins + web autostart)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ needs.build.outputs.image }}

      - name: First boot — wire baked plugins + web autostart
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          chmod 777 "$TMP"
          IMG="${{ needs.build.outputs.image }}"
          # write the verifier once on the host; docker cp it into each container (no repo script files)
          cat > "$RUNNER_TEMP/verify.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          AGENT=/home/pi/.pi/agent
          CFG="$AGENT/settings.json"

          echo "== [1] settings.json wired by wire-plugins =="
          test -e "$CFG" || { echo "FAIL: $CFG missing"; exit 1; }
          echo "PASS: settings.json exists"

          echo "== [2] absolute baked-store paths, all dirs exist =="
          COUNT="$(jq '.packages | length' "$CFG")"
          [ "$COUNT" -ge 14 ] || { echo "FAIL: only $COUNT packages"; exit 1; }
          while IFS= read -r p; do
            case "$p" in
              /home/pi/.pi-plugins/*) ;;
              *) echo "FAIL: not a baked path: $p"; exit 1 ;;
            esac
            [ -d "$p" ] || { echo "FAIL: missing baked dir: $p"; exit 1; }
          done < <(jq -r '.packages[]' "$CFG")
          echo "PASS: $COUNT absolute paths, dirs exist"

          echo "== [3] pi list resolves EXACTLY the configured packages =="
          PI_CODING_AGENT_DIR="$AGENT" pi list >/tmp/pilist.txt 2>&1
          LIST_COUNT="$(grep -c '^  /home/pi/.pi-plugins/' /tmp/pilist.txt || true)"
          CFG_COUNT="$(jq '.packages | length' "$CFG")"
          [ "$LIST_COUNT" -eq "$CFG_COUNT" ] || { echo "FAIL: pi resolved $LIST_COUNT, configured $CFG_COUNT"; exit 1; }
          echo "PASS: $LIST_COUNT == configured $CFG_COUNT"

          echo "== [4] every plugin manifest entry (extensions/skills/prompts/themes) exists =="
          FAIL=0
          while IFS= read -r p; do
            jq -e '.pi' "$p/package.json" >/dev/null 2>&1 || { echo "FAIL: no pi manifest in $p"; FAIL=1; continue; }
            for key in extensions skills prompts themes; do
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                [ -e "$p/$f" ] && continue
                case "$f" in
                  *"../"*) echo "WARN: $key '$f' in $p points outside pkg (skip)";;
                  *) echo "FAIL: missing $key '$f' in $p"; FAIL=1;;
                esac
              done < <(jq -r ".pi.$key | if type==\"array\" then .[] else . end | select(. != null)" "$p/package.json" 2>/dev/null)
            done
          done < <(jq -r '.packages[]' "$CFG")
          [ "$FAIL" -eq 0 ] || { echo "FAIL: plugin manifest check"; exit 1; }
          echo "PASS: every plugin manifest resolves"

          echo "== [5] settings.json owned by pi (uid 1000), readable by pi =="
          OWNER="$(stat -c '%u:%g' "$CFG")"
          [ "$OWNER" = "1000:1000" ] || { echo "FAIL: owner $OWNER"; exit 1; }
          su -s /bin/bash pi -c "test -r $CFG" || { echo "FAIL: pi cannot read $CFG"; exit 1; }
          echo "PASS: owner $OWNER, pi readable"

          echo "== [6] s6 services pi-web + wire-plugins are up =="
          S6RC="$(command -v s6-rc 2>/dev/null || true)"; [ -n "$S6RC" ] || S6RC=/command/s6-rc
          if [ -x "$S6RC" ]; then
            "$S6RC" -l check pi-web >/dev/null 2>&1 || { echo "FAIL: pi-web not up"; exit 1; }
            "$S6RC" -l check wire-plugins >/dev/null 2>&1 || { echo "FAIL: wire-plugins not up"; exit 1; }
            echo "PASS: pi-web + wire-plugins up"
          else
            echo "WARN: s6-rc unavailable — skipped service-up check"
          fi

          echo "== [7] base commands usable =="
          pi --version >/dev/null || { echo "FAIL: pi --version"; exit 1; }
          install.sh --help >/dev/null 2>&1 || { echo "FAIL: install.sh --help"; exit 1; }
          echo "PASS: pi + install.sh OK"

          echo "ALL PLUGIN CHECKS OK"
          SCRIPT

          docker run -d --name pi-it -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 60'
          sleep 8
          for i in $(seq 1 30); do
            docker exec pi-it test -e /home/pi/.pi/agent/settings.json && break
            sleep 2
          done
          docker cp "$RUNNER_TEMP/verify.sh" pi-it:/tmp/verify.sh
          docker exec pi-it bash /tmp/verify.sh

          # wire-plugins must have run exactly once on this boot
          GEN_COUNT="$(docker logs pi-it 2>&1 | grep -c 'generated.*baked plugins' || true)"
          [ "$GEN_COUNT" -eq 1 ] || { echo "FAIL: wire-plugins generated $GEN_COUNT times (expected 1)"; exit 1; }
          echo "PASS: wire-plugins ran exactly once"

          # Web UI daemon listening on :3141 with a non-empty body
          CODE=""
          for i in $(seq 1 15); do
            CODE="$(docker exec pi-it bash -c 'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3141' 2>/dev/null || true)"
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "web http=$CODE"
          test "$CODE" = "200"
          BODY="$(docker exec pi-it bash -c 'curl -s http://127.0.0.1:3141' 2>/dev/null || true)"
          [ -n "$BODY" ] || { echo "FAIL: web returned empty body"; exit 1; }
          echo "PASS: web body non-empty ($(printf '%s' "$BODY" | wc -c) bytes)"
          docker rm -f pi-it >/dev/null

      - name: Second boot — user-modified settings is preserved
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          chmod 777 "$TMP"
          IMG="${{ needs.build.outputs.image }}"
          docker run -d --name pi-it1 -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 20'
          sleep 10
          docker cp "$RUNNER_TEMP/verify.sh" pi-it1:/tmp/verify.sh
          docker exec pi-it1 bash /tmp/verify.sh && echo "BOOT1 WIRED OK"
          # user edits settings.json (add a marker) — must survive a restart
          docker exec pi-it1 bash -c 'jq ". + {userMark:\"keep-me\"}" /home/pi/.pi/agent/settings.json > /tmp/s2.json && mv /tmp/s2.json /home/pi/.pi/agent/settings.json'
          docker rm -f pi-it1 >/dev/null
          docker run -d --name pi-it2 -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 20'
          sleep 10
          docker cp "$RUNNER_TEMP/verify.sh" pi-it2:/tmp/verify.sh
          docker exec pi-it2 bash /tmp/verify.sh && echo "BOOT2 PERSIST OK"
          docker exec pi-it2 bash -c 'jq -e ".userMark == \"keep-me\"" /home/pi/.pi/agent/settings.json >/dev/null' \
            && echo "PASS: user marker preserved after restart" \
            || { echo "FAIL: user-modified settings.json was overwritten"; exit 1; }
          docker rm -f pi-it2 >/dev/null
