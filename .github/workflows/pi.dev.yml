name: pi.dev

on:
  push:
    branches: [master]
    paths:
      - "pi.dev/**"
      - ".github/workflows/pi.dev.yml"
  pull_request:
    paths:
      - "pi.dev/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Pi version to bake (empty = npm latest)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      image: ${{ steps.iv.outputs.image }}
    steps:
      - name: Determine Pi version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(npm view @earendil-works/pi-coding-agent version 2>/dev/null)
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to fetch @earendil-works/pi-coding-agent version" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Baking Pi version: ${VERSION}"

  build:
    needs: version
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/nuln/pi.dev:${{ needs.version.outputs.version }}
    outputs:
      image: ghcr.io/nuln/pi.dev:${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push pi.dev image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: pi.dev
          file: pi.dev/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/nuln/pi.dev:latest
            ghcr.io/nuln/pi.dev:${{ needs.version.outputs.version }}
          build-args: |
            PI_VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (amd64 default runner)
        run: |
          docker run --rm --entrypoint bash ${{ env.IMAGE }} -c 'pi --version'
          docker run --rm --entrypoint bash ${{ env.IMAGE }} -c 'jq -e '\''.packages | all(startswith("/home/pi/.pi-plugins/"))'\'' /home/pi/.pi-plugins/settings.json >/dev/null && echo "baked plugins absolute paths ok"'

  # Verify each on-demand toolchain installs and runs from a fresh bash -c (BASH_ENV path).
  # The verifier is written to the container at run time (no script files in the repo).
  toolchain:
    name: Verify ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: go
            tools: go
          - name: rust
            tools: rust
          - name: java
            tools: java
          - name: bun-node
            tools: bun node-tools
          - name: scala
            tools: scala
          - name: kotlin
            tools: kotlin
          - name: lua-php
            tools: lua php
    steps:
      - uses: actions/checkout@v4

      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ needs.build.outputs.image }}

      - name: Run install.sh and verify (${{ matrix.tools }})
        run: |
          docker run --rm --entrypoint bash \
            ${{ needs.build.outputs.image }} bash -s ${{ matrix.tools }} <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          for t in "$@"; do
            echo "== installing $t =="
            install.sh "$t"
          done
          check() {
            local bin="$1"; shift
            echo "== check $bin =="
            bash -c "command -v $bin" >/dev/null || { echo "FAIL: $bin not on PATH in bash -c (BASH_ENV not loading?)"; return 1; }
            bash -c "$bin $*" 2>&1 | head -2 || true
            echo "PASS: $bin"
          }
          for t in "$@"; do
            case "$t" in
              go)         check go version ;;
              rust)       check rustc --version; check cargo --version ;;
              java)       check java -version ;;
              bun)        check bun --version ;;
              scala)      check scala-cli version ;;
              kotlin)     check kotlin -version ;;
              node-tools) check tsc --version ;;
              lua)        check lua -v ;;
              php)        check php -v ;;
              *)          echo "WARN: no assertion defined for $t" ;;
            esac
          done
          echo "ALL TOOLCHAINS OK: $*"
          SCRIPT

  # First-boot integration test: the s6 /init must run the user bundle (wire the baked
  # plugin store into the mounted agent dir via absolute-path settings.json, auto-start the
  # Web UI daemon on :3141) and not re-write settings on the second boot.
  integration:
    name: First-boot (s6 wire-plugins + web autostart)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ${{ needs.build.outputs.image }}

      - name: First boot — wire baked plugins + web autostart
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          chmod 777 "$TMP"
          IMG="${{ needs.build.outputs.image }}"
          docker run -d --name pi-it -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 60'
          sleep 8
          for i in $(seq 1 30); do
            docker exec pi-it test -e /home/pi/.pi/agent/settings.json && break
            sleep 2
          done
          # write the verifier into the container at run time, then execute it
          docker exec -i pi-it bash -c 'cat > /tmp/verify-plugins.sh' <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          AGENT=/home/pi/.pi/agent
          echo "== [1] settings.json wired by wire-plugins =="
          test -e "$AGENT/settings.json" || { echo "FAIL: $AGENT/settings.json missing"; exit 1; }
          echo "PASS: $AGENT/settings.json exists"
          echo "== [2] all packages are absolute paths into the baked store (no copy) =="
          COUNT="$(jq '.packages | length' "$AGENT/settings.json")"
          [ "$COUNT" -ge 14 ] || { echo "FAIL: only $COUNT packages"; exit 1; }
          while IFS= read -r p; do
              case "$p" in
                /home/pi/.pi-plugins/*) ;;
                *) echo "FAIL: not a baked path: $p"; exit 1 ;;
              esac
              [ -d "$p" ] || { echo "FAIL: missing baked dir: $p"; exit 1; }
          done < <(jq -r '.packages[]' "$AGENT/settings.json")
          echo "PASS: $COUNT packages -> absolute paths, all dirs exist"
          echo "== [3] pi list resolves the baked local packages =="
          PI_CODING_AGENT_DIR="$AGENT" pi list >/tmp/pilist.txt 2>&1
          COUNT="$(grep -c '^  /home/pi/.pi-plugins/' /tmp/pilist.txt || true)"
          [ "$COUNT" -ge 14 ] || { echo "FAIL: pi resolved only $COUNT baked dirs"; exit 1; }
          echo "PASS: pi resolved $COUNT baked plugin dirs"
          echo "ALL PLUGIN CHECKS OK"
          SCRIPT
          docker exec pi-it bash /tmp/verify-plugins.sh
          CODE=""
          for i in $(seq 1 15); do
            CODE="$(docker exec pi-it bash -c 'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3141' 2>/dev/null || true)"
            [ "$CODE" = "200" ] && break
            sleep 2
          done
          echo "web http=$CODE"
          test "$CODE" = "200"
          docker rm -f pi-it >/dev/null

      - name: Second boot — settings is not re-written (user config preserved)
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          chmod 777 "$TMP"
          IMG="${{ needs.build.outputs.image }}"
          docker run -d --name pi-it1 -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 20'
          sleep 10
          docker exec -i pi-it1 bash -c 'cat > /tmp/verify-plugins.sh' <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          AGENT=/home/pi/.pi/agent
          echo "== [1] settings.json wired by wire-plugins =="
          test -e "$AGENT/settings.json" || { echo "FAIL: $AGENT/settings.json missing"; exit 1; }
          echo "PASS: $AGENT/settings.json exists"
          echo "== [2] all packages are absolute paths into the baked store (no copy) =="
          COUNT="$(jq '.packages | length' "$AGENT/settings.json")"
          [ "$COUNT" -ge 14 ] || { echo "FAIL: only $COUNT packages"; exit 1; }
          while IFS= read -r p; do
              case "$p" in
                /home/pi/.pi-plugins/*) ;;
                *) echo "FAIL: not a baked path: $p"; exit 1 ;;
              esac
              [ -d "$p" ] || { echo "FAIL: missing baked dir: $p"; exit 1; }
          done < <(jq -r '.packages[]' "$AGENT/settings.json")
          echo "PASS: $COUNT packages -> absolute paths, all dirs exist"
          echo "== [3] pi list resolves the baked local packages =="
          PI_CODING_AGENT_DIR="$AGENT" pi list >/tmp/pilist.txt 2>&1
          COUNT="$(grep -c '^  /home/pi/.pi-plugins/' /tmp/pilist.txt || true)"
          [ "$COUNT" -ge 14 ] || { echo "FAIL: pi resolved only $COUNT baked dirs"; exit 1; }
          echo "PASS: pi resolved $COUNT baked plugin dirs"
          echo "ALL PLUGIN CHECKS OK"
          SCRIPT
          docker exec pi-it1 bash /tmp/verify-plugins.sh && echo "BOOT1 WIRED OK"
          docker rm -f pi-it1 >/dev/null
          docker run -d --name pi-it2 -v "$TMP:/home/pi/.pi" "$IMG" bash -c 'sleep 20'
          sleep 10
          docker exec -i pi-it2 bash -c 'cat > /tmp/verify-plugins.sh' <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          AGENT=/home/pi/.pi/agent
          echo "== [1] settings.json wired by wire-plugins =="
          test -e "$AGENT/settings.json" || { echo "FAIL: $AGENT/settings.json missing"; exit 1; }
          echo "PASS: $AGENT/settings.json exists"
          echo "== [2] all packages are absolute paths into the baked store (no copy) =="
          COUNT="$(jq '.packages | length' "$AGENT/settings.json")"
          [ "$COUNT" -ge 14 ] || { echo "FAIL: only $COUNT packages"; exit 1; }
          while IFS= read -r p; do
              case "$p" in
                /home/pi/.pi-plugins/*) ;;
                *) echo "FAIL: not a baked path: $p"; exit 1 ;;
              esac
              [ -d "$p" ] || { echo "FAIL: missing baked dir: $p"; exit 1; }
          done < <(jq -r '.packages[]' "$AGENT/settings.json")
          echo "PASS: $COUNT packages -> absolute paths, all dirs exist"
          echo "== [3] pi list resolves the baked local packages =="
          PI_CODING_AGENT_DIR="$AGENT" pi list >/tmp/pilist.txt 2>&1
          COUNT="$(grep -c '^  /home/pi/.pi-plugins/' /tmp/pilist.txt || true)"
          [ "$COUNT" -ge 14 ] || { echo "FAIL: pi resolved only $COUNT baked dirs"; exit 1; }
          echo "PASS: pi resolved $COUNT baked plugin dirs"
          echo "ALL PLUGIN CHECKS OK"
          SCRIPT
          docker exec pi-it2 bash /tmp/verify-plugins.sh && echo "BOOT2 PERSIST OK"
          docker rm -f pi-it2 >/dev/null
