name: ocd

# Only build when the ocd/ subdirectory (or this workflow file) changes.
on:
  push:
    branches: [master]
    paths:
      - "ocd/**"
      - ".github/workflows/ocd.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Determine upstream ocd version
        id: ver
        run: |
          VERSION=$(curl -fsSL https://api.github.com/repos/elliothux/open-compute/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to fetch ocd version" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ocd version: ${VERSION}"

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: ocd
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            OCD_VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/nuln/ocd:latest
            ghcr.io/nuln/ocd:${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image ocd version matches tag
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          docker pull --platform linux/amd64 "ghcr.io/nuln/ocd:${VERSION}"
          IMG_VER=$(docker run --rm --platform linux/amd64 "ghcr.io/nuln/ocd:${VERSION}" ocd --version 2>/dev/null | awk '{print $2}' | sed 's/^v//')
          echo "In-image ocd version: ${IMG_VER}"
          echo "Expected tag version:   ${VERSION}"
          IMG_VER_N=$(echo "$IMG_VER" | tr -d '[:space:]' | sed 's/^v//')
          VER_N=$(echo "$VERSION" | tr -d '[:space:]' | sed 's/^v//')
          if [ "$IMG_VER_N" != "$VER_N" ]; then
            echo "Version mismatch! in-image=${IMG_VER} tag=${VERSION}" >&2
            exit 1
          fi
          echo "✅ In-image ocd version matches tag version (${VERSION})"

      - name: Run container functional test
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          docker run -d --name ocd-ci-test -p 8787:8787 "ghcr.io/nuln/ocd:${VERSION}"
          
          echo "Waiting for ocd daemon readiness..."
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8787/health/ready >/dev/null 2>&1; then
              echo "✅ ocd is ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Health endpoints verification
          curl -sf http://127.0.0.1:8787/health/live || { echo "❌ /health/live failed"; docker logs ocd-ci-test; exit 1; }
          curl -sf http://127.0.0.1:8787/health/ready || { echo "❌ /health/ready failed"; docker logs ocd-ci-test; exit 1; }

          # Query token and test authenticated v4 API
          TOKEN=$(docker exec ocd-ci-test cat /home/ocd/.local/share/open-compute/secrets/deployer.token)
          ACCOUNTS=$(curl -sf -H "Authorization: Bearer ${TOKEN}" http://127.0.0.1:8787/client/v4/accounts)
          echo "Accounts response: ${ACCOUNTS}"
          SUCCESS=$(echo "${ACCOUNTS}" | jq -r '.success')
          if [ "${SUCCESS}" != "true" ]; then
            echo "❌ Cloudflare v4 accounts API failed"
            docker logs ocd-ci-test
            exit 1
          fi
          echo "✅ Cloudflare v4 accounts API verified successfully"

          docker stop ocd-ci-test && docker rm ocd-ci-test
