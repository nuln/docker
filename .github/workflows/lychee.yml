name: lychee

on:
  push:
    branches: [master]
    paths:
      - "lychee/**"
      - ".github/workflows/lychee.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine pinned Lychee version
        id: ver
        run: |
          # 从 Dockerfile 的 FROM 行读取固定版本（如 v7.7.5），保证可复现构建
          VERSION=$(grep -oE 'ghcr.io/lycheeorg/lychee:v[0-9]+\.[0-9]+\.[0-9]+' lychee/Dockerfile | head -1 | sed 's#.*:##')
          if [ -z "$VERSION" ]; then
            echo "Failed to determine Lychee version from Dockerfile" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Lychee version: ${VERSION}"

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: lychee
          file: lychee/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          tags: |
            ghcr.io/nuln/lychee:latest
            ghcr.io/nuln/lychee:${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image version label matches tag
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          docker pull --platform linux/amd64 "ghcr.io/nuln/lychee:${VERSION}"
          IMG_VER=$(docker inspect --format='{{ index .Config.Labels "org.opencontainers.image.version" }}' "ghcr.io/nuln/lychee:${VERSION}" 2>/dev/null | sed 's/^v//')
          echo "Image version label: ${IMG_VER}"
          echo "Expected tag version:   ${VERSION}"
          IMG_VER_N=$(echo "$IMG_VER" | tr -d '[:space:]' | sed 's/^v//')
          VER_N=$(echo "$VERSION" | tr -d '[:space:]' | sed 's/^v//')
          if [ "$IMG_VER_N" != "$VER_N" ]; then
            echo "Version mismatch! label=${IMG_VER} tag=${VERSION}" >&2
            exit 1
          fi
          echo "✅ Image version label matches tag version (${VERSION})"

      - name: Run container (functional test)
        run: |
          mkdir -p "${{ github.workspace }}/lychee-data"
          docker run -d --name lychee -p 8080:8000 \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=/config/lychee.sqlite \
            -v "${{ github.workspace }}/lychee-data:/config" \
            "ghcr.io/nuln/lychee:${{ needs.version.outputs.version }}"
          sleep 45

      - name: Show container status
        run: docker ps -a --filter name=lychee --format "STATUS={{.Status}}"

      - name: Test domain-a (expect 307)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Host: domain-a.com" \
            -H "X-Forwarded-Host: domain-a.com" \
            -H "X-Forwarded-Proto: https" \
            http://localhost:8080/)
          echo "domain-a HTTP $code"
          [ "$code" = "307" ] || exit 1

      - name: Test domain-b (expect 307)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Host: domain-b.com" \
            -H "X-Forwarded-Host: domain-b.com" \
            -H "X-Forwarded-Proto: https" \
            http://localhost:8080/)
          echo "domain-b HTTP $code"
          [ "$code" = "307" ] || exit 1

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "===== LOGS ====="
          docker logs lychee 2>&1 | tail -60
          echo "===== curl verbose ====="
          curl -s -i -H "Host: domain-a.com" -H "X-Forwarded-Host: domain-a.com" -H "X-Forwarded-Proto: https" http://localhost:8080/ | head -30 || true

      - name: Check logs for errors
        if: always()
        run: |
          if docker logs lychee 2>&1 | grep -iE "too many consecutive failures|MissingAppKey|Error|Exception|Fatal"; then
            echo "::error::error markers found in logs"
            exit 1
          fi
          echo "no error markers in logs"

      - name: Stop container
        if: always()
        run: docker rm -f lychee || true
