# Lychee（多域名 /lychee 子路径）部署
#
# 部署方式（与 icloud / caddy 同模式：各自独立 stack，共享 caddy_net）：
#   1) 先启动 caddy 栈（创建 caddy_net 网络）
#   2) 再在本目录 `docker compose up -d`
#   3) 在 caddy/Caddyfile 对应站点加入 /lychee 反代路由（见 lychee 目录说明）
#
# 存储分层：
#   - ./data       → HDD：原图 / 大图（冷数据、大文件）
#   - ./data-ssd   → SSD：缩略图 / 小图（热数据、高 IOPS，覆盖挂在上层 HDD 之上）
#   把这两个 bind 源路径改成你机器上实际的 HDD / SSD 挂载点即可。
#
# 镜像已内置默认：APP_DIR=/lychee、DB_CONNECTION=sqlite、DB_DATABASE=/config/lychee.sqlite、
#                 TRUSTED_PROXIES=*（可用容器环境变量 TRUSTED_PROXIES 覆盖）。
name: lychee

services:
  lychee:
    image: ${LYCHEE_IMAGE:-lychee-custom:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lychee
    restart: unless-stopped

    environment:
      - TZ=${TZ:-Asia/Shanghai}

    volumes:
      # 配置 + sqlite 库 + 自动生成的 APP_KEY（镜像默认已指向 /config）
      - ./config:/config
      # 全量上传目录 → HDD（原图 / 大图在此；thumb 等子目录下方被 SSD 覆盖）
      - ./data:/app/storage/uploads
      # 缩略图 / 小预览 → SSD（覆盖在 HDD 挂载之上，单独走固态盘）
      - ./data-ssd/thumb:/app/storage/uploads/photos/thumb
      - ./data-ssd/small:/app/storage/uploads/photos/small
      - ./data-ssd/small2x:/app/storage/uploads/photos/small2x
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    # 接入现有 caddy 反向代理网络（caddy 通过 lychee:8000 反代）
    networks:
      - caddy_net

    # 低功耗机器资源限制
    mem_limit: ${MEM_LIMIT:-1g}
    cpus: ${CPU_LIMIT:-2}

networks:
  caddy_net:
    name: caddy_net
    external: true
