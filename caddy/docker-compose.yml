name: caddy

services:
  caddy:
    image: ${CADDY_IMAGE:-ghcr.io/nuln/caddy:2.11.4}
    command: caddy run --config /etc/caddy/Caddyfile
    container_name: caddy
    networks:
      - caddy_net

    ports:
      # 80/443 reverse-proxy entry; 443/udp is for UDP SNI forwarding (layer4)
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # reverse-proxy style ports (open as needed)
      - "2053:2053"
      - "8080:8080"
      - "8443:8443"

    volumes:
      # main config + standalone snippets per plugin (conf/)
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./conf:/etc/caddy/conf:ro
      # cert/data persistence (ACME-issued certs)
      - ./data:/certs
      - ./www:/var/www
      - ./logs:/var/log/caddy

    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # Cloudflare DNS-01 API Token (Zone:DNS edit permission only)
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      # PocketID OIDC client (caddy-security), callback:
      #   https://<domain>/caddy-security/oauth2/pocketid/authorization-code-callback
      - POCKETID_CLIENT_ID=${POCKETID_CLIENT_ID}
      - POCKETID_CLIENT_SECRET=${POCKETID_CLIENT_SECRET}
      # shared secret for caddy-security JWT (openssl rand -base64 32)
      - JWT_SECRET=${JWT_SECRET}

    # low-power machine resource cap
    mem_limit: ${MEM_LIMIT:-512m}
    cpus: ${CPU_LIMIT:-1}

    restart: unless-stopped

networks:
  caddy_net:
    name: caddy_net
