name: pi
services:
  pi:
    image: ${PI_IMAGE:-ghcr.io/nuln/pi.dev:0.84.1}
    container_name: pi.dev

    ports:
      # Web UI / IM gateway / Feishu callback (change host port via .env)
      - "${PI_WEB_PORT:-3141}:3141"
      - "${PI_GATEWAY_PORT:-3847}:3847"
      - "${PI_FEISHU_PORT:-3001}:3001"
      # - "${PI_RELAY_PORT:-3030}:3030"   # remote-pi relay (self-host only)

    volumes:
      # pi config/state + toolchain caches + code workspace + persisted CLI logins
      - ./data/pi:/home/pi/.pi
      - ./data/cache:/home/pi/cache
      - ./data/workspace:/home/pi/dev
      - ./data/creds:/home/pi/.creds

    environment:
      - TZ=${TZ}
      # Web UI autostart (true=on/false=off); skills whitelist; first-boot permission policy
      - PI_AUTOSTART_WEB=${PI_AUTOSTART_WEB:-true}
      - PI_SKILLS=${PI_SKILLS:-false}
      - PI_PERMISSION_SYSTEM_POLICY=${PI_PERMISSION_SYSTEM_POLICY:-}
      # opencode provider auto-config: set key -> free always, Go plan probed automatically
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      # credential persistence mount (scans baked whitelist; extra ~-relative
      # paths can be persisted via the internal default PI_CRED_EXTRA)
      - PI_CREDS_DIR=${PI_CREDS_DIR:-/home/pi/.creds}
      # outbound proxy for the whole container (blank = off)
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1}

    working_dir: /home/pi/dev

    # TUI needs a TTY
    stdin_open: true
    tty: true

    # container hardening: no privileged caps, no priv escalation. s6 + pi +
    # installed toolchains all run as the unprivileged `pi` user (uid 1000);
    # the root init only supervises services, so no capabilities are required.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # overall resource cap
    mem_limit: ${MEM_LIMIT:-4g}
    cpus: ${CPU_LIMIT:-2}

    restart: unless-stopped