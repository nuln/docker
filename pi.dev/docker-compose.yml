name: pi
services:
  pi:
    image: ${PI_IMAGE:-ghcr.io/nuln/pi.dev:latest}
    container_name: pi.dev

    ports:
      # Web UI (pi-web-chat, pi --web) — see PLUGINS.md section 16
      - "${PI_WEB_PORT:-3141}:3141"
      # IM gateway (@gamalan/pi-gateway); @llblab/pi-telegram uses long polling and needs none
      - "${PI_GATEWAY_PORT:-3847}:3847"
      # Feishu/Lark card callback (FEISHU_CARD_ACTION_WEBHOOK_PORT defaults to 3001)
      - "${PI_FEISHU_PORT:-3001}:3001"
      # remote-pi relay (map when self-hosting; adjust to your custom port)
      # - "${PI_RELAY_PORT:-3030}:3030"

    volumes:
      # pi config/state (~/.pi); the preinstalled plugin store stays baked in the image
      - ./data/pi:/home/pi/.pi
      # on-demand language toolchains (Go/Rust/Java/...)
      - ./data/cache:/home/pi/cache
      # code project working dir
      - ./data/workspace:/home/pi/dev

    environment:
      - TZ=${TZ}
      - PI_CODING_AGENT_DIR=/home/pi/.pi/agent
      # auto-start the Web UI daemon on container start; set 0 to disable
      - PI_AUTOSTART_WEB=${PI_AUTOSTART_WEB:-1}
      # conservative resource limits for a weak host (e.g. Intel J3455)
      - CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-1}
      - GOMAXPROCS=${GOMAXPROCS:-2}
      - MAKEFLAGS=${MAKEFLAGS:--j2}

    working_dir: /home/pi/dev

    # the TUI needs a TTY
    stdin_open: true
    tty: true

    # overall container resource cap
    mem_limit: ${MEM_LIMIT:-4g}
    cpus: ${CPU_LIMIT:-2}

    restart: unless-stopped
