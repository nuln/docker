# Deployment behind a reverse proxy that terminates TLS — the usual production shape.
#
# Use this instead of docker-compose.yml when a proxy (Caddy, nginx, Traefik…) fronts the instance.
# Two differences from the single-container file:
#   * no published port — the proxy is the only way in;
#   * the shared external network, so the proxy can reach the container by name.
#
#   docker network create proxy        # once
#   docker compose -f docker-compose.proxy.yml up -d
#
# Caddyfile.example has a working configuration. The one thing it must NOT do is strip the prefix:
# both the OIDC callback and the WebSub callback URL are built from the public base URL and are
# matched against the path Apache actually serves, so a stripping proxy breaks them.

name: freshrss

services:
  freshrss:
    image: ${FRESHRSS_IMAGE:-ghcr.io/nuln/freshrss:1.30.0}
    container_name: freshrss
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Etc/UTC}

      # Every domain behind this proxy must use the SAME prefix.
      # https://a.example/rss and https://b.example/rss — one instance, two domains.
      FRESHRSS_PATH_PREFIX: ${FRESHRSS_PATH_PREFIX:-/rss}

      # Leave unset so the host follows the request. Set it only to pin one domain.
      # FRESHRSS_BASE_URL: https://a.example/rss

      # Required for WebSub: its callback is generated by the cron job, with no request in scope.
      # FRESHRSS_WEBSUB_BASE_URL: https://rss.example.net/rss

      FRESHRSS_INSTALL: >-
        --default-user ${ADMIN_USER:-alice}
        --db-type sqlite
        --auth-type form
        --title ${FRESH_TITLE:-FreshRSS}
      FRESHRSS_USER: --user ${ADMIN_USER:-alice} --password ${ADMIN_PASSWORD:-change-me-now}

      CRON_MIN: ${CRON_MIN:-7,37 * * * *}

      # The proxy's subnet, so FreshRSS trusts X-Forwarded-For. Without it the real client address
      # is lost, which is mostly harmless but makes rate limiting and logs useless.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-172.16.0.0/12}

      # Content-Security-Policy. FreshRSS hard-codes `default-src 'self'`, which blocks anything a
      # third party injects into the page — most commonly Cloudflare Browser Insights, whose beacon
      # then never loads and the console fills with violations. Empty by default, keeping the strict
      # upstream policy; set it in .env to allow an origin, e.g.
      #   FRESHRSS_CSP_SCRIPT_SRC='self' https://static.cloudflareinsights.com
      # It sets `script-src`, which overrides `default-src` for scripts only: every other directive
      # still falls back to `default-src 'self'`. Sources need a scheme and, unless it is the
      # default for that scheme, the port, because CSP matches host *and* port exactly.
      FRESHRSS_CSP_SCRIPT_SRC: ${FRESHRSS_CSP_SCRIPT_SRC:-}

      # --- OIDC (optional, all-or-nothing) --------------------------------------------
      # One redirect URI per domain, each <FRESHRSS_PATH_PREFIX>/i/oidc/ :
      #   https://a.example/rss/i/oidc/
      #   https://b.example/rss/i/oidc/
      # OIDC_ENABLED: '1'
      # OIDC_PROVIDER_METADATA_URL: https://idp.example/.well-known/openid-configuration
      # OIDC_CLIENT_ID: freshrss
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      # OIDC_CLIENT_CRYPTO_CLIENT_KEY: ''
      # OIDC_CLIENT_CRYPTO_KEY: 0123456789abcdef0123456789abcdef
      # OIDC_SCOPES: openid profile

    volumes:
      - ./data:/var/www/FreshRSS/data

    networks:
      - proxy

    # No published port on purpose.
    healthcheck:
      test: ['CMD', '/usr/local/bin/freshrss-healthcheck']
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  proxy:
    external: true