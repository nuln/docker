# Single-command deployment: `docker compose up -d`, then open the URL it prints.
#
# Everything is configured through environment variables (see .env.example); no file under ./data
# ever has to be edited by hand. Copy `.env.example` to `.env` first if you want to change anything —
# the defaults below work as they are.

name: freshrss

services:
  freshrss:
    # The published tags are the upstream FreshRSS version the patch is based on, plus `latest`.
    # The package on ghcr.io is PRIVATE: authenticate once with a token that has the `read:packages`
    # scope before starting, otherwise the pull fails with "not found".
    #   echo "$GHCR_TOKEN" | docker login ghcr.io -u nuln --password-stdin
    image: ${FRESHRSS_IMAGE:-ghcr.io/nuln/freshrss:1.30.0}
    container_name: freshrss
    restart: unless-stopped

    # Bound to the loopback interface on purpose: FreshRSS has no TLS, so it must sit behind a reverse
    # proxy before it is reachable from anywhere else. Change to "8080:80" to publish on all
    # interfaces (only sensible behind a firewall or for a throwaway test).
    ports:
      - "${FRESHRSS_BIND:-127.0.0.1}:${FRESHRSS_PORT:-8080}:80"

    environment:
      TZ: ${TZ:-Etc/UTC}

      # The public sub-directory. Every domain that reaches this instance must use the SAME prefix,
      # because the OIDC callback and the session cookie path are derived from it.
      # This single value drives the Apache Alias, the OIDC callback path, the cookie path, the
      # healthcheck and the `base_url` written at install time. Set it to an empty value to serve the
      # instance at the root of each domain instead.
      FRESHRSS_PATH_PREFIX: ${FRESHRSS_PATH_PREFIX:-/rss}

      # Leave unset so the host follows the request, which is what lets several domains share one
      # instance. Set it to pin a single domain (e.g. https://a.example/rss).
      # FRESHRSS_BASE_URL: https://a.example/rss

      # Required to enable WebSub: its callback URL is generated by the refresh cron job, which runs
      # with no HTTP request, so it needs one stable public address. Point it at ONE domain.
      # FRESHRSS_WEBSUB_BASE_URL: https://rss.example.net/rss

      # --- unattended installation -------------------------------------------------
      # Argument strings for cli/do-install.php and cli/create-user.php. Together they install the
      # instance and create the administrator, so the first page you see is the login form rather
      # than the setup wizard. Both are ignored on later starts ("already installed").
      FRESHRSS_INSTALL: >-
        --default-user ${ADMIN_USER:-alice}
        --db-type sqlite
        --auth-type form
        --title ${FRESH_TITLE:-FreshRSS}
      FRESHRSS_USER: --user ${ADMIN_USER:-alice} --password ${ADMIN_PASSWORD:-change-me-now}

      # Feed refresh cron, in the container's timezone. This is a WHOLE crontab expression, not just
      # the minutes, despite the name: every 30 minutes is "*/30 * * * *". A shorter value is
      # completed with "* * * *" by the entrypoint, so "*/30" also works.
      CRON_MIN: ${CRON_MIN:-7,37 * * * *}

      # Content-Security-Policy. FreshRSS hard-codes `default-src 'self'`, which blocks anything a
      # third party injects into the page — most commonly Cloudflare Browser Insights, whose beacon
      # then never loads and the console fills with violations. Empty by default, keeping the strict
      # upstream policy; set it in .env to allow an origin, e.g.
      #   FRESHRSS_CSP_SCRIPT_SRC='self' https://static.cloudflareinsights.com
      # It sets `script-src`, which overrides `default-src` for scripts only: every other directive
      # still falls back to `default-src 'self'`. Sources need a scheme and, unless it is the
      # default for that scheme, the port, because CSP matches host *and* port exactly.
      FRESHRSS_CSP_SCRIPT_SRC: ${FRESHRSS_CSP_SCRIPT_SRC:-}

      # --- OIDC (optional, all-or-nothing) --------------------------------------------
      # Turning this on makes mod_auth_openidc handle every request. Register ONE redirect URI per
      # domain in your identity provider, each being <FRESHRSS_PATH_PREFIX>/i/oidc/ :
      #   https://a.example/rss/i/oidc/
      #   https://b.example/rss/i/oidc/
      # OIDC_ENABLED: '1'
      # OIDC_PROVIDER_METADATA_URL: https://idp.example/.well-known/openid-configuration
      # OIDC_CLIENT_ID: freshrss
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      # OIDC_CLIENT_CRYPTO_KEY: 0123456789abcdef0123456789abcdef
      # OIDC_SCOPES: openid profile

      # --- email validation (optional) ------------------------------------------------
      # force_email_validation signs a token and mails a verification link; the account stays
      # restricted until that link is followed. Needs SMTP.
      # force_email_validation: 'true'
      # mailer: smtp
      # smtp: {host: mail.example.net, port: 587, auth: true, username: freshrss, password: secret, secure: tls, from: freshrss@example.net}

      # Only needed when a reverse proxy forwards the client's address and FreshRSS must trust it.
      # TRUSTED_PROXY: ${TRUSTED_PROXY}

    volumes:
      # The SQLite database, configuration and per-user state. This is the only thing to back up.
      - ./data:/var/www/FreshRSS/data

    healthcheck:
      test: ['CMD', '/usr/local/bin/freshrss-healthcheck']
      interval: 30s
      timeout: 10s
      retries: 5
      # The first start installs FreshRSS and fetches the default feed, which takes a while.
      start_period: 90s

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'