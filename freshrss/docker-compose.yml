name: freshrss

services:
  freshrss:
    image: ghcr.io/nuln/freshrss:latest
    container_name: freshrss
    restart: unless-stopped
    # The public sub-directory the instance is served from.
    # Every domain must use the same prefix: https://a.example/rss and https://b.example/rss
    # Leave empty to serve the instance at the root of each domain.
    # The ONLY setting a sub-directory deployment needs: it drives the Apache Alias, the OIDC
    # callback path, the session cookie path, the healthcheck, and the `base_url` written by
    # the installation wizard. Nothing under ./data has to be edited.
    environment:
      FRESHRSS_PATH_PREFIX: /rss
      #
      # Optional: pin a single domain instead of following the request.
      # FRESHRSS_BASE_URL: https://a.example/rss
      #
      # Optional: required to enable WebSub, which needs one stable publicly reachable
      # address because its callback is generated by the refresh cron job.
      # FRESHRSS_WEBSUB_BASE_URL: https://rss.example.net/rss
      #
      # OIDC. `redirect_uri` becomes <FRESHRSS_PATH_PREFIX>/i/oidc/ — register one entry per
      # domain in your identity provider, e.g.
      #   https://a.example:443/rss/i/oidc/
      #   https://b.example:443/rss/i/oidc/
      # OIDC_ENABLED: '1'
      # OIDC_PROVIDER_METADATA_URL: https://idp.example/.well-known/openid-configuration
      # OIDC_CLIENT_ID: freshrss
      # OIDC_CLIENT_SECRET: change-me
      # OIDC_CLIENT_CRYPTO_KEY: 0123456789abcdef0123456789abcdef
      # OIDC_SCOPES: openid profile
      #
      # Feed refresh cron (optional, "7,37 * * * *").
      # CRON_MIN: '7,37 * * * *'
      #
      # Docker network of your reverse proxy, so it can trust the forwarded headers.
      # TRUSTED_PROXY: 172.16.0.1/12
    volumes:
      - ./data:/var/www/FreshRSS/data
    # No published port: the reverse proxy is the only way in.
    networks:
      - proxy
    healthcheck:
      test: ['CMD', '/usr/local/bin/freshrss-healthcheck']
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  proxy:
    external: true
