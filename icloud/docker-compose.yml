name: icloud

services:
  icloud:
    image: ${ICLOUD_IMAGE:-ghcr.io/nuln/icloud:1.28.0}
    container_name: icloud
    restart: unless-stopped

    environment:
      # must match the host user's uid/gid, otherwise the mount has no permission
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1001}
      - TZ=${TZ:-Asia/Shanghai}
      - ENV_CONFIG_FILE_PATH=/config/config.yaml
      # encryption passphrase (fill in .env or export before `docker compose up`)
      - KEYRING_PASSPHRASE=${KEYRING_PASSPHRASE}
      # Telegram proxy for China region (uncomment and adjust):
      # HTTPS_PROXY: "http://<proxy IP>:<port>"
      # NO_PROXY: "setup.icloud.com,*.icloud.com,setup.icloud.com.cn,*.icloud.com.cn,www.icloud.com,*.icloud-content.com"

    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      # backup data: if Drive/Photos are on different disks, change host paths
      - ./data/drive:/icloud/drive      # iCloud Drive
      - ./data/photos:/icloud/photos    # iCloud Photos
      - ./config:/config                # config + encrypted keyring

    # low-power machine resource cap
    mem_limit: ${MEM_LIMIT:-1g}
    cpus: ${CPU_LIMIT:-2}

    # No ports exposed: iCloud sync is an outbound connection, no port mapping needed
